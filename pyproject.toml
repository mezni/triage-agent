[project]
name = "support-ticket-triage"
version = "0.1.0"
description = "Production-oriented AI customer-support triage agent, built from scratch."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]